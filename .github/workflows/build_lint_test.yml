name: Continuous integration

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.95.0"

jobs:
  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Format, check, and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run unit tests
        run: cargo test --locked --workspace --lib --bins

  integration-tests:
    name: Docker-backed integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Verify Docker availability
        run: docker version
      - name: Run integration tests
        run: cargo test --locked --workspace --tests -- --test-threads=1

  build-artifact:
    name: Linux release artifact
    needs: [dependency-audit, quality, unit-tests, integration-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --locked --release --package telos-consensus-client --bin telos-consensus-client
      - name: Verify and package release binary
        env:
          ARTIFACT_ROOT: telos-consensus-client-${{ github.sha }}-x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          target/release/telos-consensus-client --help >/dev/null
          mkdir -p "dist/${ARTIFACT_ROOT}"
          install -m 0755 target/release/telos-consensus-client "dist/${ARTIFACT_ROOT}/telos-consensus-client"
          (
            cd "dist/${ARTIFACT_ROOT}"
            sha256sum telos-consensus-client > SHA256SUMS
          )
          tar -C dist -czf "dist/${ARTIFACT_ROOT}.tar.gz" "${ARTIFACT_ROOT}"
          (
            cd dist
            sha256sum "${ARTIFACT_ROOT}.tar.gz" > "${ARTIFACT_ROOT}.tar.gz.sha256"
          )
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telos-consensus-client-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  reproducibility:
    name: Reproducible Linux release artifact
    needs: build-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telos-consensus-client-linux-x86_64-${{ github.sha }}
          path: release-dist
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: reproducibility
      - name: Independently rebuild and compare the release binary
        env:
          ARTIFACT_ROOT: telos-consensus-client-${{ github.sha }}-x86_64-unknown-linux-gnu
          CARGO_TARGET_DIR: target-reproducibility
        run: |
          set -euo pipefail
          (cd release-dist && sha256sum --check "${ARTIFACT_ROOT}.tar.gz.sha256")
          mkdir extracted
          tar -C extracted -xzf "release-dist/${ARTIFACT_ROOT}.tar.gz"
          (cd "extracted/${ARTIFACT_ROOT}" && sha256sum --check SHA256SUMS)
          cargo build --locked --release --package telos-consensus-client --bin telos-consensus-client
          cmp \
            "extracted/${ARTIFACT_ROOT}/telos-consensus-client" \
            "${CARGO_TARGET_DIR}/release/telos-consensus-client"
          sha256sum \
            "extracted/${ARTIFACT_ROOT}/telos-consensus-client" \
            "${CARGO_TARGET_DIR}/release/telos-consensus-client"
